# Render Free Blueprint for ecom-automation
# 免费版仅部署 API Gateway 与管理后台静态站点。
# PostgreSQL、Redis、MongoDB、各私有微服务、n8n、Metabase 和 RAG 服务不在免费版中创建。
# 免费 Web Service 可能休眠，首次访问会有冷启动延迟。
previews:
  generation: off

services:
  - type: web
    runtime: docker
    name: ecom-api-gateway
    rootDir: services/api-gateway
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PRODUCT_SERVICE_URL
        value: http://product-service:8006/api/products
      - key: OMS_SERVICE_URL
        value: http://oms-service:8005/api/tickets

  - type: web
    runtime: static
    name: ecom-admin
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://ecom-api-gateway.onrender.com
      - key: VITE_CUSTOMER_API_BASE
        value: https://ecom-api-gateway.onrender.com
