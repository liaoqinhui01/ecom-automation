# Render Blueprint for ecom-automation
# 核心 API 与微服务采用 Docker；数据库使用 Render Postgres/Key Value；MongoDB 使用持久磁盘私有服务。
previews:
  generation: off

services:
  - type: web
    runtime: docker
    name: ecom-api-gateway
    rootDir: services/api-gateway
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecom-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ecom-redis
          property: connectionString
      - key: PRODUCT_SERVICE_URL
        value: http://ecom-product-service:8006/api/products
      - key: OMS_SERVICE_URL
        value: http://ecom-oms-service:8005/api/tickets

  - type: pserv
    runtime: docker
    name: ecom-product-service
    rootDir: services/product-service
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    disk:
      name: product-data
      mountPath: /app/data
      sizeGB: 5
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ecom-redis
          property: connectionString

  - type: pserv
    runtime: docker
    name: ecom-oms-service
    rootDir: services/oms-service
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecom-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ecom-redis
          property: connectionString

  - type: pserv
    runtime: docker
    name: ecom-douyin-adapter
    rootDir: services/douyin-adapter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecom-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ecom-redis
          property: connectionString
      - key: DOUYIN_CLIENT_ID
        sync: false
      - key: DOUYIN_CLIENT_SECRET
        sync: false
      - key: DOUYIN_ACCESS_TOKEN
        sync: false

  - type: pserv
    runtime: docker
    name: ecom-kuaishou-adapter
    rootDir: services/kuaishou-adapter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecom-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ecom-redis
          property: connectionString
      - key: KUAISHOU_APP_ID
        sync: false
      - key: KUAISHOU_APP_SECRET
        sync: false
      - key: KUAISHOU_ACCESS_TOKEN
        sync: false

  - type: pserv
    runtime: docker
    name: ecom-pdd-cs-adapter
    rootDir: services/pdd-cs-adapter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecom-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ecom-redis
          property: connectionString
      - key: PDD_CLIENT_ID
        sync: false
      - key: PDD_CLIENT_SECRET
        sync: false
      - key: PDD_ACCESS_TOKEN
        sync: false

  - type: pserv
    runtime: docker
    name: ecom-xianyu-adapter
    rootDir: services/xianyu-adapter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    disk:
      name: xianyu-data
      mountPath: /app/data
      sizeGB: 2
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/data/xianyu.db
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ecom-redis
          property: connectionString
      - key: XIANYU_COOKIES
        sync: false

  - type: pserv
    runtime: docker
    name: ecom-hermes-control
    rootDir: services/hermes-control
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecom-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ecom-redis
          property: connectionString

  - type: pserv
    runtime: docker
    name: ecom-competitor-crawler
    rootDir: services/competitor-crawler
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    disk:
      name: crawler-data
      mountPath: /app/data
      sizeGB: 5
    envVars:
      - key: MONGODB_URL
        value: mongodb://ecom-mongodb:27017
      - key: MONGODB_DATABASE
        value: competitor_crawler
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ecom-redis
          property: connectionString

  - type: pserv
    runtime: docker
    name: ecom-mongodb
    repo: https://github.com/render-examples/mongodb
    plan: starter
    disk:
      name: mongodb-data
      mountPath: /data/db
      sizeGB: 10

  - type: keyvalue
    name: ecom-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    persistenceMode: journal-snapshot
    ipAllowList: []

  - type: web
    runtime: static
    name: ecom-admin
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://ecom-api-gateway.onrender.com
      - key: VITE_CUSTOMER_API_BASE
        value: https://ecom-api-gateway.onrender.com

  - type: pserv
    runtime: image
    name: ecom-n8n
    plan: starter
    image:
      url: docker.io/n8nio/n8n:latest
    envVars:
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        sync: false
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: ecom-postgres
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: ecom-postgres
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: ecom-postgres
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: ecom-postgres
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: ecom-postgres
          property: password

databases:
  - name: ecom-postgres
    databaseName: ecom_automation
    user: ecom
    plan: basic-256mb
    ipAllowList: []
